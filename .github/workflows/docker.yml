name: Release 3X-UI for Docker

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version tag
        required: true
        default: 2.9.4-23wl1
      stable_version:
        description: Stable release alias
        required: true
        default: 2.9.4
      publish_latest:
        description: Publish the latest tag
        required: true
        type: boolean
        default: true
  push:
    branches:
      - "3xui"
      - "codex/openflux-2.9.4-23wl1"
    tags:
      - "v*.*.*"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lagnuty/3x-ui
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=2.9.4-23wl1,enable=${{ github.event_name == 'push' && (github.ref_name == '3xui' || github.ref_name == 'codex/openflux-2.9.4-23wl1') }}
            type=raw,value=2.9.4,enable=${{ github.event_name == 'push' && (github.ref_name == '3xui' || github.ref_name == 'codex/openflux-2.9.4-23wl1') }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && (github.ref_name == '3xui' || github.ref_name == 'codex/openflux-2.9.4-23wl1') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ inputs.stable_version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_latest }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/386
          build-args: |
            XRAY_VERSION=v26.9.30
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

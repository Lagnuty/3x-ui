{{define "settings/xray/outbounds"}}
<a-space direction="vertical" size="middle">
    <a-row>
        <a-col :xs="12" :sm="12" :lg="12">
            <a-space direction="horizontal" size="small">
                <a-button type="primary" icon="plus" @click="addOutbound">
                    <span v-if="!isMobile">{{ i18n
                        "pages.xray.outbound.addOutbound" }}</span>
                </a-button>
                <a-button type="primary" icon="cloud"
                    @click="showWarp()">WARP</a-button>
                <a-button icon="link" @click="openOutboundSub">Outbound Sub</a-button>
            </a-space>
        </a-col>
        <a-col :xs="12" :sm="12" :lg="12" :style="{ textAlign: 'right' }">
            <a-button-group>
                <a-button icon="sync" @click="refreshOutboundTraffic()"
                    :loading="refreshing"></a-button>
                <a-popconfirm placement="topRight"
                    @confirm="resetOutboundTraffic(-1)"
                    title='{{ i18n "pages.inbounds.resetTrafficContent"}}'
                    :overlay-class-name="themeSwitcher.currentTheme"
                    ok-text='{{ i18n "reset"}}'
                    cancel-text='{{ i18n "cancel"}}'>
                    <a-icon slot="icon" type="question-circle-o"
                        :style="{ color: themeSwitcher.isDarkTheme ? '#008771' : '#008771' }"></a-icon>
                    <a-button icon="retweet"></a-button>
                </a-popconfirm>
            </a-button-group>
        </a-col>
    </a-row>
        <a-card size="small" title="Panel Egress Bridge" :style="{ marginBottom: '12px' }">
        <a-alert
            type="info"
            message="Route the panel's own outbound requests through a selected Xray outbound. A loopback SOCKS inbound tagged panel-egress is injected into the generated runtime config."
            show-icon
            :style="{ marginBottom: '10px' }">
        </a-alert>
        <a-row :gutter="[12, 12]" :style="{ alignItems: 'center' }">
            <a-col :xs="24" :md="12">
                <a-select v-model="panelOutbound" allow-clear placeholder="Direct panel egress" :style="{ width: '100%' }">
                    <a-select-option v-for="o in outboundData" :key="o.tag" :value="o.tag" :disabled="!o.tag || o.tag === 'blocked'">
                        [[ o.tag || '(no tag)' ]] ([[ o.protocol ]])
                    </a-select-option>
                    <a-select-option v-for="b in balancersData" :key="'balancer:' + b.tag" :value="b.tag" :disabled="!b.tag">
                        [[ b.tag ]] (balancer)
                    </a-select-option>
                </a-select>
            </a-col>
            <a-col :xs="24" :md="12">
                <a-tag v-if="panelOutbound" color="blue">panel-egress -> [[ panelOutbound ]]</a-tag>
                <a-tag v-else>Direct</a-tag>
            </a-col>
        </a-row>
    </a-card>
    <a-table :columns="outboundColumns" bordered :row-key="r => r.key"
        :data-source="outboundData"
        :scroll="isMobile ? {} : { x: 800 }" :pagination="false"
        :indent-size="0"
        :locale='{ filterConfirm: `{{ i18n "confirm" }}`, filterReset: `{{ i18n "reset" }}` }'>
        <template slot="action" slot-scope="text, outbound, index">
            <span>[[ index+1 ]]</span>
            <a-dropdown :trigger="['click']">
                <a-icon @click="e => e.preventDefault()" type="more"
                    :style="{ fontSize: '16px', textDecoration: 'bold' }"></a-icon>
                <a-menu slot="overlay" :theme="themeSwitcher.currentTheme">
                    <a-menu-item v-if="index>0"
                        @click="setFirstOutbound(index)">
                        <a-icon type="vertical-align-top"></a-icon>
                        <span>{{ i18n "pages.xray.rules.first"}}</span>
                    </a-menu-item>
                    <a-menu-item @click="editOutbound(index)">
                        <a-icon type="edit"></a-icon>
                        <span>{{ i18n "edit" }}</span>
                    </a-menu-item>
                    <a-menu-item @click="resetOutboundTraffic(index)">
                        <span>
                            <a-icon type="retweet"></a-icon>
                            <span>{{ i18n "pages.inbounds.resetTraffic"}}</span>
                        </span>
                    </a-menu-item>
                    <a-menu-item @click="deleteOutbound(index)">
                        <span :style="{ color: '#FF4D4F' }">
                            <a-icon type="delete"></a-icon>
                            <span>{{ i18n "delete"}}</span>
                        </span>
                    </a-menu-item>
                </a-menu>
            </a-dropdown>
        </template>
        <template slot="address" slot-scope="text, outbound, index">
            <p :style="{ margin: '0 5px' }"
                v-for="addr in findOutboundAddress(outbound)">[[ addr ]]</p>
        </template>
        <template slot="protocol" slot-scope="text, outbound, index">
            <a-tag :style="{ margin: '0' }" color="purple">[[ outbound.protocol
                ]]</a-tag>
            <template
                v-if="[Protocols.VMess, Protocols.VLESS, Protocols.Trojan, Protocols.Shadowsocks].includes(outbound.protocol)">
                <a-tag :style="{ margin: '0' }" color="blue">[[
                    outbound.streamSettings.network ]]</a-tag>
                <a-tag :style="{ margin: '0' }"
                    v-if="outbound.streamSettings.security=='tls'"
                    color="green">tls</a-tag>
                <a-tag :style="{ margin: '0' }"
                    v-if="outbound.streamSettings.security=='reality'"
                    color="green">reality</a-tag>
            </template>
        </template>
        <template slot="traffic" slot-scope="text, outbound, index">
            <a-tag color="green">[[ findOutboundTraffic(outbound) ]]</a-tag>
        </template>
        <template slot="test" slot-scope="text, outbound, index">
            <a-tooltip>
                <template slot="title">{{ i18n "pages.xray.outbound.test"
                    }}</template>
                <a-button
                    type="primary"
                    shape="circle"
                    icon="thunderbolt"
                    :loading="outboundTestStates[index] && outboundTestStates[index].testing"
                    @click="testOutbound(index)"
                    :disabled="(outbound.protocol === 'blackhole' || outbound.tag === 'blocked') || (outboundTestStates[index] && outboundTestStates[index].testing)">
                </a-button>
            </a-tooltip>
        </template>
        <template slot="testResult" slot-scope="text, outbound, index">
            <div
                v-if="outboundTestStates[index] && outboundTestStates[index].result">
                <a-tag v-if="outboundTestStates[index].result.success"
                    color="green">
                    [[ outboundTestStates[index].result.delay ]]ms
                    <span v-if="outboundTestStates[index].result.statusCode">
                        ([[ outboundTestStates[index].result.statusCode
                        ]])</span>
                </a-tag>
                <a-tooltip v-else
                    :title="outboundTestStates[index].result.error">
                    <a-tag color="red">
                        Failed
                    </a-tag>
                </a-tooltip>
            </div>
            <span
                v-else-if="outboundTestStates[index] && outboundTestStates[index].testing">
                <a-icon type="loading" />
            </span>
            <span v-else>-</span>
        </template>
    </a-table>
    <a-card size="small" title="Outbound Subscriptions" :style="{ marginTop: '12px' }">
        <template #extra>
            <a-space>
                <a-button size="small" icon="plus" @click="openOutboundSub">Add</a-button>
                <a-button size="small" icon="reload" @click="loadOutboundSubs">Refresh</a-button>
            </a-space>
        </template>
        <a-alert
            type="info"
            message="Fetched JSON outbounds are merged into Xray config on restart. Duplicate tags are skipped."
            show-icon
            :style="{ marginBottom: '10px' }">
        </a-alert>
        <a-table
            size="small"
            row-key="id"
            :columns="outboundSubColumns"
            :data-source="outboundSubs"
            :pagination="{ pageSize: 8 }"
            :scroll="{ x: 900 }">
            <template slot="enabled" slot-scope="text, row">
                <a-tag :color="row.enabled ? 'green' : 'red'">[[ row.enabled ? 'Enabled' : 'Disabled' ]]</a-tag>
            </template>
            <template slot="lastUpdated" slot-scope="text, row">
                [[ row.lastUpdated ? new Date(row.lastUpdated * 1000).toLocaleString() : '-' ]]
            </template>
            <template slot="error" slot-scope="text, row">
                <a-tooltip v-if="row.lastError" :title="row.lastError">
                    <a-tag color="red">Error</a-tag>
                </a-tooltip>
                <span v-else>-</span>
            </template>
            <template slot="actions" slot-scope="text, row">
                <a-space>
                    <a-button size="small" icon="sync" @click="refreshOutboundSub(row)">Fetch</a-button>
                    <a-button size="small" icon="edit" @click="openOutboundSub(row)">Edit</a-button>
                    <a-button size="small" icon="arrow-up" @click="moveOutboundSub(row, 'up')"></a-button>
                    <a-button size="small" icon="arrow-down" @click="moveOutboundSub(row, 'down')"></a-button>
                    <a-popconfirm title="Delete outbound subscription?" @confirm="deleteOutboundSub(row)">
                        <a-button size="small" icon="delete" type="danger">Delete</a-button>
                    </a-popconfirm>
                </a-space>
            </template>
        </a-table>
    </a-card>
</a-space>
{{end}}

{{define "form/naive"}}
<a-collapse activeKey="0" v-for="(client, index) in inbound.settings.naives.slice(0,1)" v-if="!isEdit">
    <a-collapse-panel header='{{ i18n "pages.inbounds.client" }}'>
        {{template "form/client" .}}
    </a-collapse-panel>
</a-collapse>
<a-collapse v-else>
    <a-collapse-panel :header="'{{ i18n "pages.client.clientCount"}} : ' + inbound.settings.naives.length">
        <table width="100%">
            <tr class="client-table-header">
                <th>{{ i18n "pages.inbounds.email" }}</th>
                <th>{{ i18n "password" }}</th>
            </tr>
            <tr v-for="(client, index) in inbound.settings.naives"
                :class="index % 2 == 1 ? ' client-table-odd-row' : ''">
                <td>[[ client.email ]]</td>
                <td>[[ client.password ]]</td>
            </tr>
        </table>
    </a-collapse-panel>
</a-collapse>
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-form-item label="Allow Transparent">
        <a-switch v-model="inbound.settings.allowTransparent" />
    </a-form-item>
</a-form>
{{end}}

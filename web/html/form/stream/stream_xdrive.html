{{define "form/streamXDrive"}}
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
  <a-alert type="warning" show-icon style="margin-bottom: 12px"
    message="XDRIVE requires Xray v26.10.17+ and VLESS decryption. Every client must have empty Flow; use one listening port. Raw vless:// links and older clients do not describe this transport."></a-alert>
  <a-form-item label="Service">
    <a-select v-model="inbound.stream.xdrive.service" :dropdown-class-name="themeSwitcher.currentTheme">
      <a-select-option value="local">Local</a-select-option>
      <a-select-option value="google-drive">Google Drive</a-select-option>
      <a-select-option value="template">Template</a-select-option>
    </a-select>
  </a-form-item>
  <a-form-item label="Remote folder">
    <a-input v-model.trim="inbound.stream.xdrive.remoteFolder" placeholder="Shared folder on both peers"></a-input>
  </a-form-item>
  <template v-if="inbound.stream.xdrive.service === 'google-drive'">
    <a-form-item label="Client ID"><a-input v-model.trim="inbound.stream.xdrive.secrets[0]"></a-input></a-form-item>
    <a-form-item label="Client secret"><a-input-password v-model.trim="inbound.stream.xdrive.secrets[1]"></a-input-password></a-form-item>
    <a-form-item label="Refresh token"><a-input-password v-model.trim="inbound.stream.xdrive.secrets[2]"></a-input-password></a-form-item>
  </template>
  <a-alert v-if="inbound.stream.xdrive.service === 'template'" type="info" show-icon
    message="Template supports two-step storage APIs: set hrefPath and optional hrefMethod on put/get/list/delete operations. Keep credentials in the first request only."></a-alert>
  <a-form-item v-if="inbound.stream.xdrive.service === 'template'" label="Template JSON">
    <a-textarea v-model="inbound.stream.xdrive.templateText" :rows="10" placeholder='{"put":{"url":"https://api.example/upload","hrefPath":"href","hrefMethod":"PUT"}}'></a-textarea>
  </a-form-item>
  <a-form-item label="HTTP/3">
    <a-button size="small" :disabled="inbound.stream.security !== 'tls'"
      @click="inbound.stream.tls.alpn = ['h3']">Use H3</a-button>
    <a-button size="small" :disabled="inbound.stream.security !== 'tls'"
      @click="inbound.stream.tls.alpn = ['h2']">Use H2</a-button>
    <a-tag v-if="inbound.stream.security === 'tls' && inbound.stream.tls.alpn.length === 1 && inbound.stream.tls.alpn[0] === 'h3'">H3 active</a-tag>
  </a-form-item>
  <a-alert type="info" show-icon message="XDRIVE H3 requires TLS ALPN exactly h3 and a valid TLS certificate. Google Drive H3 permits only UDP noise masks; QUIC congestion must be BBR or Reno. The core sends Chrome-like HTTP headers by default."></a-alert>
  <a-form-item label="XMUX override"><a-switch v-model="inbound.stream.xdrive.enableXmux"></a-switch></a-form-item>
  <template v-if="inbound.stream.xdrive.enableXmux">
    <a-alert type="info" show-icon message="Without an override, Xray uses 4 H2 connections for Google Drive and 1 otherwise. Do not set both maxConnections and maxConcurrency."></a-alert>
    <a-form-item label="Max connections"><a-input v-model.trim="inbound.stream.xdrive.xmux.maxConnections" placeholder="1 or 1-4"></a-input></a-form-item>
    <a-form-item label="Max concurrency"><a-input v-model.trim="inbound.stream.xdrive.xmux.maxConcurrency" placeholder="0 or 16-32"></a-input></a-form-item>
    <a-form-item label="Client max reuse"><a-input v-model.trim="inbound.stream.xdrive.xmux.cMaxReuseTimes" placeholder="0"></a-input></a-form-item>
    <a-form-item label="H max requests"><a-input v-model.trim="inbound.stream.xdrive.xmux.hMaxRequestTimes" placeholder="0 or 600-900"></a-input></a-form-item>
    <a-form-item label="H reusable seconds"><a-input v-model.trim="inbound.stream.xdrive.xmux.hMaxReusableSecs" placeholder="1800-3000"></a-input></a-form-item>
    <a-form-item label="H keep-alive seconds"><a-input-number v-model.number="inbound.stream.xdrive.xmux.hKeepAlivePeriod" :min="0"></a-input-number></a-form-item>
  </template>
  <a-form-item label="Segment bytes"><a-input-number v-model.number="inbound.stream.xdrive.segmentBytes" :min="0"></a-input-number></a-form-item>
  <a-form-item label="Flush interval (ms)"><a-input-number v-model.number="inbound.stream.xdrive.flushIntervalMs" :min="0"></a-input-number></a-form-item>
  <a-form-item label="Poll interval (ms)"><a-input-number v-model.number="inbound.stream.xdrive.pollIntervalMs" :min="0"></a-input-number></a-form-item>
  <a-form-item label="Max poll interval (ms)"><a-input-number v-model.number="inbound.stream.xdrive.maxPollIntervalMs" :min="0"></a-input-number></a-form-item>
  <a-form-item label="Session TTL (s)"><a-input-number v-model.number="inbound.stream.xdrive.sessionTtlSeconds" :min="0"></a-input-number></a-form-item>
  <a-form-item label="Concurrency"><a-input-number v-model.number="inbound.stream.xdrive.concurrency" :min="0"></a-input-number></a-form-item>
  <a-form-item label="Eager window (ms)"><a-input-number v-model.number="inbound.stream.xdrive.eagerWindowMs" :min="0"></a-input-number></a-form-item>
  <a-form-item label="Hole timeout (ms)"><a-input-number v-model.number="inbound.stream.xdrive.holeTimeoutMs" :min="0"></a-input-number></a-form-item>
  <a-alert type="info" show-icon message="Zero tuning values are omitted so Xray chooses its own defaults."></a-alert>
</a-form>
{{end}}
